<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060f;--glass:rgba(255,255,255,0.04);--glass-b:rgba(255,255,255,0.08);
  --text:#f1f5f9;--muted:#64748b;--accent:#f59e0b;
  --purple:#8b5cf6;--cyan:#06b6d4;--emerald:#10b981;--red:#ef4444;
}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.25;animation:drift 25s infinite ease-in-out}
.b1{width:600px;height:600px;background:var(--purple);top:-200px;left:-150px}
.b2{width:500px;height:500px;background:var(--cyan);top:-100px;right:-100px;animation-delay:-9s}
.b3{width:700px;height:700px;background:#059669;bottom:-300px;left:30%;animation-delay:-18s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.06)}}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 48px;background:rgba(6,6,15,.75);backdrop-filter:blur(24px);border-bottom:1px solid var(--glass-b)}
.logo{font-weight:900;font-size:17px;text-decoration:none;color:var(--text)}
.logo em{font-style:normal;color:var(--accent)}
.nav-links{display:flex;gap:8px}
.nav-links a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;transition:all .2s}
.nav-links a:hover{color:var(--text);background:var(--glass)}
.nav-links a.active{color:var(--accent)}
.page{position:relative;z-index:1;padding-top:90px}
.wrap{max-width:960px;margin:0 auto;padding:0 24px 80px}
.hero{text-align:center;padding:60px 24px 40px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:4px;font-weight:700;color:var(--cyan);background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.2);padding:6px 16px;border-radius:99px;margin-bottom:16px}
.hero h1{font-size:clamp(40px,8vw,88px);font-weight:900;letter-spacing:-4px;line-height:.9;margin-bottom:8px}
.grad{background:linear-gradient(135deg,var(--accent),var(--purple),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{color:var(--muted);font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:28px 0}
.fbtn{padding:8px 18px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--glass-b);color:var(--muted);background:var(--glass);cursor:pointer;transition:all .2s;font-family:inherit}
.fbtn:hover,.fbtn.on{color:var(--accent);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.group-section{margin-bottom:32px}
.group-header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-b);margin-bottom:10px;backdrop-filter:blur(16px)}
.group-letter{font-size:36px;font-weight:900;color:var(--accent);line-height:1;min-width:28px;text-align:center}
.group-teams{display:flex;flex-wrap:wrap;gap:6px}
.team-tag{padding:3px 10px;border-radius:8px;font-size:12px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--glass-b)}

/* MATCH ROW — table-like */
.match-row{
  display:grid;
  grid-template-columns:44px 96px 1fr auto 100px;
  align-items:center;gap:10px;
  padding:12px 16px;margin-bottom:5px;
  background:var(--glass);border:1px solid var(--glass-b);
  border-radius:12px;transition:all .2s;backdrop-filter:blur(12px);
}
.match-row:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.match-row.is-done{border-left:2px solid var(--emerald)}
.match-row.is-live{border-left:2px solid var(--red)}

.mid{font-size:10px;color:var(--muted);font-weight:700;text-align:center}
.date-col{text-align:left}
.date-col .dt{font-size:12px;font-weight:700}
.date-col .tm{font-size:11px;color:var(--muted);margin-top:1px}
.date-col .cd{font-size:10px;color:var(--cyan);margin-top:2px;font-variant-numeric:tabular-nums}

.teams{display:flex;align-items:center;justify-content:center;gap:6px}
.team-a{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end}
.team-b{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-start}
.flag{font-size:20px;line-height:1}
.tname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}

.score-box{
  display:flex;align-items:center;justify-content:center;
  min-width:64px;padding:4px 10px;border-radius:8px;
  font-size:17px;font-weight:900;letter-spacing:1px;
  background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.2);
  color:var(--emerald);
}
.score-box.live{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.2);color:var(--red)}
.vs-box{
  min-width:64px;padding:4px 10px;border-radius:8px;text-align:center;
  font-size:11px;font-weight:800;color:var(--muted);
  border:1px solid var(--glass-b);background:transparent;
}

.pill{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap;text-align:right}
.pill-up{color:var(--cyan);background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.2)}
.pill-ft{color:var(--emerald);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2)}
.pill-live{color:var(--red);background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.venue-col{font-size:10px;color:var(--muted);text-align:right;line-height:1.4}

.no-data{text-align:center;padding:60px 0;color:var(--muted);font-size:14px}

@media(max-width:640px){
  nav{padding:14px 20px}
  .match-row{grid-template-columns:36px 80px 1fr auto}
  .venue-col{display:none}
  .tname{max-width:70px}
  .hero h1{letter-spacing:-2px}
}
</style>
</head>

let cur = "all";

function buildFilters(){
  const btns = [["all","All Matches"],...GROUPS.map(g => [g.letter,"Group "+g.letter])];
  document.getElementById("filters").innerHTML = btns.map(([v,lbl]) =>
    `<button class="fbtn${v===cur?" on":""}" onclick="setFilter('${v}',this)">${lbl}</button>`
  ).join("");
}

function setFilter(v, btn){
  cur = v;
  document.querySelectorAll(".fbtn").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  buildSchedule();
}

function buildSchedule(){
  const root = document.getElementById("schedule-root");
  root.innerHTML = "";

  GROUPS.forEach(g => {
    if(cur !== "all" && g.letter !== cur) return;

    const sec = document.createElement("div");
    sec.className = "group-section";

    const teamTags = g.teams.map(t => `<span class="team-tag">${t.flag} ${t.name}</span>`).join("");
    sec.innerHTML = `<div class="group-header">
      <div class="group-letter">${g.letter}</div>
      <div class="group-teams">${teamTags}</div>
    </div>`;

    g.matches.forEach(m => {
      const live   = liveMap[m.id] || {};
      const status = live.status || "Upcoming";
      const isDone = status === "Completed";
      const isLive = status === "Live";

      // date + time from live data if available, else blank
      const dateStr = live.date || "";
      const timeStr = live.time || "";

      let centerHtml;
      if(isDone || isLive){
        const sa = live.scoreA != null ? live.scoreA : "—";
        const sb = live.scoreB != null ? live.scoreB : "—";
        centerHtml = `<div class="score-box${isLive?" live":""}">${sa} – ${sb}</div>`;
      } else {
        centerHtml = `<div class="vs-box">VS</div>`;
      }

      let pillHtml;
      if(isDone)     pillHtml = `<span class="pill pill-ft">✅ FT</span>`;
      else if(isLive) pillHtml = `<span class="pill pill-live">🔴 LIVE</span>`;
      else           pillHtml = `<span class="pill pill-up" id="pill-${m.id}">📅</span>`;

      let cdHtml = "";
      if(isDone)      cdHtml = "";
      else if(isLive) cdHtml = `<div class="cd" style="color:var(--red);font-size:10px">In Progress</div>`;
      else            cdHtml = `<div class="cd" id="cd-${m.id}"></div>`;

      const row = document.createElement("div");
      row.className = "match-row" + (isDone?" is-done":"") + (isLive?" is-live":"");
      row.innerHTML = `
        <div class="mid">${m.id}</div>
        <div class="date-col">
          <div class="dt">${dateStr}</div>
          <div class="tm">${timeStr ? timeStr+" IST" : ""}</div>
          ${cdHtml}
        </div>
        <div class="teams">
          <div class="team-a"><span class="tname">${m.teamA}</span><span class="flag">${m.fA}</span></div>
          ${centerHtml}
          <div class="team-b"><span class="flag">${m.fB}</span><span class="tname">${m.teamB}</span></div>
        </div>
        ${pillHtml}
        <div class="venue-col">${live.venue || m.venue}<br><span style="font-size:9px;color:#475569">${live.city || m.city}</span></div>
      `;

      // countdown for upcoming matches only
      if(!isDone && !isLive && timeStr && dateStr){
        const cdEl = row.querySelector(`#cd-${m.id}`);
        if(cdEl){
          // parse date + time to UTC
          const monthMap={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};
          const parts  = dateStr.split(" "); // e.g. ["12","Jun","2026"]
          const day    = parts[0]||"";
          const mon    = monthMap[parts[1]]||"06";
          const yr     = parts[2]||"2026";
          const [h,min]= timeStr.split(":");
          // IST = UTC+5:30, so UTC = IST - 5h30m
          const utcH   = (parseInt(h)-5+24)%24;
          const utcM   = (parseInt(min)-30+60)%60;
          const utcHStr= String(utcH).padStart(2,"0");
          const utcMStr= String(utcM).padStart(2,"0");
          const target = new Date(`${yr}-${mon}-${day.padStart(2,"0")}T${utcHStr}:${utcMStr}:00Z`);
          function tick(){
            const diff = target - new Date();
            if(diff<=0){ cdEl.textContent="Soon"; return; }
            const d=Math.floor(diff/86400000), h2=Math.floor(diff%86400000/3600000), mn=Math.floor(diff%3600000/60000);
            cdEl.textContent = d>0 ? `in ${d}d ${h2}h` : `in ${h2}h ${mn}m`;
          }
          tick();
          setInterval(tick, 60000);
        }
      }

      sec.appendChild(row);
    });

    root.appendChild(sec);
  });

  // If no live schedule data at all, show a note
  if(SCHEDULE.length === 0){
    const note = document.createElement("p");
    note.className = "no-data";
    note.textContent = "Schedule data loading…";
    root.prepend(note);
  }
}

buildFilters();
buildSchedule();
