<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Dugout · FIFA Fantasy 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060f;
  --glass:rgba(255,255,255,0.04);
  --glass-b:rgba(255,255,255,0.08);
  --text:#f1f5f9;
  --muted:#64748b;
  --accent:#f59e0b;
  --purple:#8b5cf6;
  --cyan:#06b6d4;
  --emerald:#10b981;
  --red:#ef4444;
  --gold:#fbbf24;
  --silver:#94a3b8;
  --bronze:#b45309;
  --blue:#60a5fa;
}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
}

/* AURORA */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.28;animation:drift 25s infinite ease-in-out}
.b1{width:700px;height:700px;background:var(--purple);top:-250px;left:-200px;animation-delay:0s}
.b2{width:550px;height:550px;background:var(--cyan);top:-150px;right:-150px;animation-delay:-9s}
.b3{width:800px;height:800px;background:#059669;bottom:-350px;left:25%;animation-delay:-18s}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(40px,-60px) scale(1.08)}
  66%{transform:translate(-30px,40px) scale(.94)}
}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 48px;
  background:rgba(6,6,15,.75);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--glass-b);
}
.logo{font-weight:900;font-size:17px;letter-spacing:-.5px;text-decoration:none;color:var(--text)}
.logo em{font-style:normal;color:var(--accent)}
.nav-links{display:flex;gap:8px}
.nav-links a{
  color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;
  padding:7px 14px;border-radius:8px;transition:all .2s;
}
.nav-links a:hover{color:var(--text);background:var(--glass)}
.nav-links a.active{color:var(--accent)}

/* PAGE */
.page{position:relative;z-index:1;padding-top:90px}
.wrap-inner{max-width:1100px;margin:0 auto;padding:0 24px}

/* HERO */
.hero{text-align:center;padding:60px 24px 40px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:4px;font-weight:700;color:var(--accent);
  background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);
  padding:6px 16px;border-radius:99px;margin-bottom:20px;
}
.hero h1{
  font-size:clamp(44px,9vw,96px);font-weight:900;
  letter-spacing:-4px;line-height:.92;margin-bottom:10px;
}
.grad{
  background:linear-gradient(135deg,var(--gold) 0%,var(--purple) 50%,var(--cyan) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-sub{color:var(--muted);font-size:15px}

/* TAB BAR */
.tab-bar{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  padding:28px 24px 32px;position:relative;z-index:1;
}
.tab-btn{
  padding:9px 20px;border-radius:99px;
  border:1px solid var(--glass-b);
  background:var(--glass);color:var(--muted);
  cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:12px;font-weight:700;letter-spacing:.5px;
  transition:all .2s;
}
.tab-btn:hover{border-color:rgba(245,158,11,.4);color:var(--accent)}
.tab-btn.active{
  background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(139,92,246,.12));
  color:var(--accent);border-color:rgba(245,158,11,.4);
  box-shadow:0 4px 20px rgba(245,158,11,.15);
}

/* CONTAINER */
.container{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 24px 80px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* SECTION HEADER */
.sec-hd{
  font-size:10px;letter-spacing:4px;font-weight:700;
  color:var(--muted);margin-bottom:24px;
  display:flex;align-items:center;gap:12px;
}
.sec-hd::after{content:'';flex:1;height:1px;background:var(--glass-b)}

/* ── FANTASY TRACKER ── */
.fantasy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.fantasy-card{
  background:var(--glass);border:1px solid var(--glass-b);
  border-radius:20px;padding:22px;backdrop-filter:blur(20px);
  transition:.3s;position:relative;overflow:hidden;
}
.fantasy-card:hover{transform:translateY(-4px);border-color:rgba(245,158,11,.25);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.fc-header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.fc-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--glass-b);background:var(--glass)}
.fc-name-wrap{flex:1;min-width:0}
.fc-name{font-size:16px;font-weight:800}
.fc-sub{font-size:12px;color:var(--muted);margin-top:2px}
.fc-pts-badge{text-align:center;flex-shrink:0}
.fc-pts{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.fc-pts-lbl{font-size:9px;letter-spacing:2px;color:var(--muted)}
.fc-progress-row{margin-bottom:10px}
.fc-progress-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;color:var(--muted)}
.fc-progress-label span:last-child{color:var(--text);font-weight:700}
.fc-bar-bg{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.fc-bar{height:100%;border-radius:3px;transition:width 1s ease}
.fc-bar.green{background:linear-gradient(90deg,var(--emerald),#34d399)}
.fc-bar.red{background:linear-gradient(90deg,var(--red),#f87171)}
.fc-bar.gold{background:linear-gradient(90deg,var(--gold),var(--accent))}
.fc-divider{height:1px;background:var(--glass-b);margin:14px 0}
.fc-footer{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.fc-footer strong{color:var(--text)}

/* ── AWARD CARDS (Golden Boot / Glove / Playmaker) ── */
.award-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:32px}
.award-card{
  background:var(--glass);border:1px solid var(--glass-b);
  border-radius:20px;padding:22px;backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:16px;
  transition:.3s;position:relative;overflow:hidden;
}
.award-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(245,158,11,.04),transparent);
  pointer-events:none;
}
.award-card:hover{border-color:rgba(245,158,11,.3);transform:translateY(-2px)}
.award-card.top1{border-color:rgba(251,191,36,.45);box-shadow:0 0 30px rgba(251,191,36,.12)}
.award-card.top2{border-color:rgba(148,163,184,.35)}
.award-card.top3{border-color:rgba(180,83,9,.35)}
.award-rank{font-size:36px;font-weight:900;min-width:44px;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.award-rank.r1{color:var(--gold)}
.award-rank.r2{color:var(--silver)}
.award-rank.r3{color:var(--bronze)}
.award-rank.rn{color:var(--muted)}
.award-flag-col{font-size:28px;line-height:1;flex-shrink:0}
.award-info{flex:1;min-width:0}
.award-name{font-size:15px;font-weight:800;color:var(--text)}
.award-team{font-size:12px;color:var(--muted);margin-top:3px}
.award-stats{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.award-stat .val{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text)}
.award-stat .lbl{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.award-icon{position:absolute;top:12px;right:14px;font-size:22px;opacity:.45}

/* ── TEAM FORM ── */
.team-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.team-card{
  background:var(--glass);border:1px solid var(--glass-b);
  border-radius:20px;padding:22px;backdrop-filter:blur(20px);transition:.3s;
}
.team-card:hover{border-color:rgba(245,158,11,.2);transform:translateY(-2px)}
.tsc-header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.tsc-flag{font-size:32px;line-height:1}
.tsc-name{font-size:18px;font-weight:800}
.tsc-group{font-size:12px;color:var(--muted);margin-top:2px}
.tsc-stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.tsc-stat{text-align:center;background:rgba(255,255,255,.03);border-radius:10px;padding:10px 4px}
.tsc-stat .val{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.tsc-stat .lbl{font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.tsc-form-lbl{text-align:center;font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.tsc-form{display:flex;gap:4px;justify-content:center}
.form-pill{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.form-pill.W{background:rgba(16,185,129,.2);color:var(--emerald);border:1px solid rgba(16,185,129,.3)}
.form-pill.D{background:rgba(251,191,36,.2);color:var(--gold);border:1px solid rgba(251,191,36,.3)}
.form-pill.L{background:rgba(239,68,68,.2);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.form-pill.q{background:rgba(100,116,139,.12);color:var(--muted);border:1px solid var(--glass-b);font-size:8px}

/* ── MATCH REEL ── */
.match-log-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--glass-b)}
table.match-log{width:100%;border-collapse:collapse;font-size:13px}
table.match-log th{
  background:rgba(245,158,11,.06);color:var(--accent);
  font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:12px 14px;text-align:left;font-size:10px;
  white-space:nowrap;
}
table.match-log tr{border-bottom:1px solid rgba(255,255,255,.05)}
table.match-log tr:last-child{border-bottom:none}
table.match-log td{padding:12px 14px;vertical-align:middle}
table.match-log tr:hover td{background:rgba(245,158,11,.03)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.pill.correct{background:rgba(16,185,129,.15);color:var(--emerald)}
.pill.wrong{background:rgba(239,68,68,.15);color:var(--red)}
.pill.missed{background:rgba(100,116,139,.15);color:var(--muted)}

/* ── FACE-OFF COMPARE ── */
.compare-wrap{
  background:var(--glass);border:1px solid var(--glass-b);
  border-radius:20px;padding:28px;backdrop-filter:blur(20px);
}
.compare-selects{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.compare-select{
  flex:1;min-width:150px;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-b);
  color:var(--text);padding:10px 14px;border-radius:10px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;
  cursor:pointer;outline:none;transition:.2s;
}
.compare-select:focus{border-color:var(--accent)}
.vs-label{font-size:20px;font-weight:900;color:var(--accent);padding:0 4px}
.compare-legend{display:flex;gap:20px;margin-bottom:18px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:50%}
.legend-dot.a{background:var(--gold)}
.legend-dot.b{background:var(--blue)}
.compare-bars{display:flex;flex-direction:column;gap:14px}
.cmp-row{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:14px}
.cmp-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:right}
.cmp-bar-wrap{position:relative;height:10px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden}
.cmp-bar-a{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:5px;transition:width .8s ease}
.cmp-bar-b{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--blue),#3b82f6);border-radius:5px;opacity:.7;transition:width .8s ease}
.cmp-val{font-size:14px;font-weight:800;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}

/* NO DATA */
.no-data{text-align:center;padding:60px 20px;color:var(--muted)}
.no-data .icon{font-size:48px;margin-bottom:14px}
.no-data p{font-size:15px;margin-bottom:6px}
.no-data small{font-size:12px;opacity:.6}

/* ── PLAYER STATS ── */
.ps-filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.ps-filter{
  background:rgba(255,255,255,.05);border:1px solid var(--glass-b);
  color:var(--text);padding:8px 14px;border-radius:10px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;
  cursor:pointer;outline:none;transition:.2s;
}
.ps-filter:focus{border-color:var(--accent)}
.ps-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--glass-b)}
table.ps-table{width:100%;border-collapse:collapse;font-size:13px}
table.ps-table th{
  background:rgba(245,158,11,.06);color:var(--muted);
  font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:12px 14px;text-align:left;font-size:10px;
  white-space:nowrap;cursor:pointer;user-select:none;
}
table.ps-table th:hover{color:var(--accent)}
table.ps-table th.sort-desc::after{content:' ↓';color:var(--accent)}
table.ps-table th.sort-asc::after{content:' ↑';color:var(--accent)}
table.ps-table tr{border-bottom:1px solid rgba(255,255,255,.05)}
table.ps-table tr:last-child{border-bottom:none}
table.ps-table td{padding:11px 14px;vertical-align:middle}
table.ps-table tr:hover td{background:rgba(245,158,11,.03)}

/* RESPONSIVE */
@media(max-width:640px){
  nav{padding:14px 20px}
  .nav-links a span{display:none}
  .tsc-stats-row{grid-template-columns:repeat(3,1fr)}
  .cmp-row{grid-template-columns:70px 1fr auto}
  .tab-btn{padding:7px 14px;font-size:11px}
}
</style>
</head>

// ── TAB SWITCH ────────────────────────────────────────────────────────────────
function switchTab(btn){
  var id = btn.getAttribute('data-tab');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  var panel = document.getElementById('tab-'+id);
  if(panel){ panel.classList.add('active'); panel.scrollIntoView({behavior:'smooth',block:'start'}); }
}

// ── FANTASY TRACKER ───────────────────────────────────────────────────────────
function buildFantasyGrid(){
  const grid = document.getElementById('fantasy-grid');
  grid.innerHTML = LEADERBOARD.map(p=>{
    const total = p.correct+p.wrong+p.missed||1;
    const pct = v => Math.round((v/total)*100);
    const avgPts = (p.correct+p.wrong+p.missed)>0 ? (p.pts/total).toFixed(1) : '—';
    return `
    <div class="fantasy-card">
      <div class="fc-header">
        <img class="fc-avatar" src="assets/avatars/${p.player.toLowerCase()}_avatar.png" alt="${p.player}"
          onerror="this.style.display='none'">
        <div class="fc-name-wrap">
          <div class="fc-name">#${p.rank} ${p.player}</div>
          <div class="fc-sub">${p.streak} · Δ ${p.delta}</div>
        </div>
        <div class="fc-pts-badge">
          <div class="fc-pts">${p.pts}</div>
          <div class="fc-pts-lbl">PTS</div>
        </div>
      </div>
      <div class="fc-progress-row">
        <div class="fc-progress-label"><span>✅ Correct</span><span>${p.correct} (${pct(p.correct)}%)</span></div>
        <div class="fc-bar-bg"><div class="fc-bar green" style="width:${pct(p.correct)}%"></div></div>
      </div>
      <div class="fc-progress-row">
        <div class="fc-progress-label"><span>❌ Wrong</span><span>${p.wrong} (${pct(p.wrong)}%)</span></div>
        <div class="fc-bar-bg"><div class="fc-bar red" style="width:${pct(p.wrong)}%"></div></div>
      </div>
      <div class="fc-progress-row">
        <div class="fc-progress-label"><span>💤 Missed</span><span>${p.missed} (${pct(p.missed)}%)</span></div>
        <div class="fc-bar-bg"><div class="fc-bar gold" style="width:${pct(p.missed)}%"></div></div>
      </div>
      <div class="fc-divider"></div>
      <div class="fc-footer">
        <span>Avg/match: <strong>${avgPts}</strong></span>
        <span>Played: <strong>${p.correct+p.wrong+p.missed}</strong></span>
      </div>
    </div>`;
  }).join('');
}

// ── SHARED AWARD BUILDER ──────────────────────────────────────────────────────
function buildAward({gridId, emptyId, data, icon, rankKey, statCols}){
  const grid  = document.getElementById(gridId);
  const empty = document.getElementById(emptyId);
  if(!data.length || !data.some(s=>(parseInt(s[rankKey])||0)>0)){
    grid.style.display='none';
    if(empty) empty.style.display='block';
    return;
  }
  if(empty) empty.style.display='none';
  grid.style.display='';
  const sorted   = [...data].sort((a,b)=>(parseInt(b[rankKey])||0)-(parseInt(a[rankKey])||0));
  const rkCls    = ['r1','r2','r3'];
  const cardCls  = ['top1','top2','top3'];
  grid.innerHTML = sorted.map((s,i)=>`
    <div class="award-card ${cardCls[i]||''}">
      ${i===0?`<div class="award-icon">${icon}</div>`:''}
      <div class="award-rank ${rkCls[i]||'rn'}">${i+1}</div>
      <div class="award-flag-col">${s.flag||FLAG_MAP[s.team]||'🏳️'}</div>
      <div class="award-info">
        <div class="award-name">${s.name}</div>
        <div class="award-team">${s.team}</div>
        <div class="award-stats">

// ── PLAYER STATS ──────────────────────────────────────────────────────────────
var psSortKey = 'Goals', psSortDir = -1;

function sortBy(key){
  if(psSortKey===key) psSortDir=-psSortDir;
  else { psSortKey=key; psSortDir=-1; }
  document.querySelectorAll('#ps-table th[data-col]').forEach(th=>{
    th.classList.remove('sort-asc','sort-desc');
    if(th.dataset.col===key) th.classList.add(psSortDir>0?'sort-asc':'sort-desc');
  });
  filterPlayers();
}

function filterPlayers(){
  const q    = (document.getElementById('ps-search')||{value:''}).value.toLowerCase();
  const pos  = (document.getElementById('ps-pos-filter')||{value:''}).value;
  const team = (document.getElementById('ps-team-filter')||{value:''}).value;
  const POS_COLOR = {GK:'var(--cyan)',DEF:'var(--emerald)',MID:'var(--purple)',FWD:'var(--red)'};
  let rows = PLAYER_STATS.filter(p=>{
    if(q && !(p.Player||'').toLowerCase().includes(q)) return false;
    if(pos && p.Position!==pos) return false;
    if(team && p.Team!==team) return false;
    return true;
  });
  rows.sort((a,b)=>{
    const av = parseFloat(a[psSortKey])||0;
    const bv = parseFloat(b[psSortKey])||0;
    return psSortDir*(bv-av) || (a.Player||'').localeCompare(b.Player||'');
  });
  const body = document.getElementById('ps-body');
  if(!body) return;
  if(!rows.length){
    body.innerHTML = '<tr><td colspan="19" style="text-align:center;padding:40px;color:var(--muted)">No players match your filter</td></tr>';
    return;
  }
  const cc = p => POS_COLOR[p]||'var(--muted)';
  const v  = (p,k) => { const n=parseFloat(p[k]); return isNaN(n)||n===0?'<span style="color:var(--muted)">0</span>':n; };
  body.innerHTML = rows.map((p,i)=>`
    <tr>
      <td style="color:var(--muted)">${i+1}</td>
      <td>${FLAG_MAP[p.Team]||'🏳️'} <strong>${p.Player}</strong></td>
      <td style="color:var(--muted)">${p.Team}</td>
      <td><span style="background:${cc(p.Position)}20;color:${cc(p.Position)};border:1px solid ${cc(p.Position)}40;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">${p.Position||'—'}</span></td>
      <td>${p.Matches||0}</td>
      <td style="color:var(--emerald);font-weight:700">${v(p,'Goals')}</td>
      <td style="color:var(--cyan);font-weight:700">${v(p,'Assists')}</td>
      <td>${v(p,'Saves')}</td>
      <td style="color:var(--emerald)">${v(p,'Clean Sheets')}</td>
      <td style="color:var(--purple)">${v(p,'Chances Created')}</td>
      <td>${v(p,'Passes')}</td>
      <td>${v(p,'Tackles')}</td>
      <td>${v(p,'Interceptions')}</td>
      <td>${v(p,'Aerial Duels Won')}</td>
      <td>${v(p,'Blocks')}</td>
      <td style="color:var(--red)">${v(p,'Fouls')}</td>
      <td style="color:var(--gold)">${p['Yellow Cards']||0}</td>
      <td style="color:var(--red)">${p['Red Cards']||0}</td>
      <td style="color:var(--accent);font-weight:700">${parseFloat(p.Rating)||'—'}</td>
    </tr>`).join('');
}

function buildPlayerStats(){
  const teamSel = document.getElementById('ps-team-filter');
  if(teamSel && PLAYER_STATS.length){
    const teams = [...new Set(PLAYER_STATS.map(p=>p.Team).filter(Boolean))].sort();
    teamSel.innerHTML = '<option value="">All Teams</option>'
      + teams.map(t=>`<option value="${t}">${FLAG_MAP[t]||''} ${t}</option>`).join('');
  }
  const psEmpty = document.getElementById('ps-empty');
  const psWrap  = document.getElementById('ps-wrap');
  if(!PLAYER_STATS.length){
    if(psEmpty) psEmpty.style.display='block';
    if(psWrap)  psWrap.style.display='none';
  } else {
    if(psEmpty) psEmpty.style.display='none';
    if(psWrap)  psWrap.style.display='';
    filterPlayers();
  }
}
